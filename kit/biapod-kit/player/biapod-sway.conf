# Dedicated session: no Sxmo daemons, no idle/suspend trigger.
output DSI-1 scale 1
input type:touch map_to_output DSI-1
default_border none
default_floating_border none
seat * hide_cursor 2000
bindsym --locked XF86AudioRaiseVolume exec /usr/bin/python3 /home/user/pinepod/biapod-media-key.py volume-up
bindsym --locked XF86AudioLowerVolume exec /usr/bin/python3 /home/user/pinepod/biapod-media-key.py volume-down
bindsym --locked --no-repeat XF86AudioNext exec /usr/bin/python3 /home/user/pinepod/biapod-media-key.py next
bindsym --locked --no-repeat XF86AudioPrev exec /usr/bin/python3 /home/user/pinepod/biapod-media-key.py previous
bindsym --locked --no-repeat XF86AudioStop exec /usr/bin/python3 /home/user/pinepod/biapod-media-key.py stop
bindsym --locked --no-repeat XF86PowerOff exec /usr/bin/python3 /home/user/pinepod/biapod-power-button.py
for_window [app_id="biapod-maintenance"] floating enable, resize set 700 px 900 px, move position 10 px 10 px
exec /usr/bin/python3 /home/user/pinepod/biapod-headset-control.py
exec /usr/bin/python3 /home/user/pinepod/biapod.py
